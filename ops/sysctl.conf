# AmberCell host sysctl draft (Stage-0A stub)
# Apply deliberately on a dedicated honeypot host — do not paste blindly on shared workstations.
# Stage-0B+ documents which knobs are required for the active profile.

# --- IPv6 ---
# Disable IPv6 on honeypot bridges/cells so listeners cannot bypass IPv4 nft DNAT/egress.
# Prefer interface-scoped settings for ambernet; host-wide disable is operator choice.
# net.ipv6.conf.all.disable_ipv6 = 1
# net.ipv6.conf.default.disable_ipv6 = 1
# Also drop ip6 on ambernet via nftables (see nftables/ in later stages).

# --- Forwarding / reverse path (production profile) ---
# Required for host DNAT of attacker flows into ambernet.
# net.ipv4.ip_forward = 1
# net.ipv4.conf.all.rp_filter = 1
# net.ipv4.conf.default.rp_filter = 1
# Set rp_filter=1 on the ambernet interface as well once created.

# --- inotify (upload floods / artifact watchers) ---
# Stage-1 required on production honeypot hosts when running host-side canary/YARA
# helpers alongside high-volume upload cells. Prefer collector UDS artifact streams
# over recursive host inotify; these sysctls are a backstop against watch exhaustion.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# --- Core dumps (Stage-3 caution) ---
# Do NOT point host-wide kernel.core_pattern at /var/ambercell/artifacts/cores/.
# Use a scoped pipe handler that only accepts AmberCell cgroups, or leave default
# See ops/coredump-scoped.md for the Stage-3 pipe handler pattern.
# # kernel.core_pattern = |/usr/local/libexec/ambercell-coredump %p %s %c %d %P
