[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambercell-collector-base"
version = "0.1.0"
description = "AmberCell Stage-0B shared collector library"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
validate = ["jsonschema>=4.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ambercell*"]
