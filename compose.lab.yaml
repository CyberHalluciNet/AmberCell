# Lab overlay — published ports for laptop/CI (bind localhost only).
# Usage:
#   COMPOSE_PROFILES=lab,core docker compose -f compose.yaml -f compose.lab.yaml up -d
# Production (nftables DNAT, no Compose ports):
#   COMPOSE_PROFILES=production,core docker compose -f compose.yaml up -d

services:
  ftp-collector:
    ports:
      - "127.0.0.1:${AMBER_FTP_HOST_PORT:-21}:21"
      - "127.0.0.1:30000-30049:30000-30049"
    environment:
      # Lab DNAT/proxy may rewrite destinations; production should leave unset/0.
      AMBER_FTP_RELAX_DST: ${AMBER_FTP_RELAX_DST:-1}

  ftp-hi:
    environment:
      # Lab-only PASV advertise (same-host published ports). Production must set public IP.
      AMBER_FTP_PASV_ADDRESS: ${AMBER_FTP_PASV_ADDRESS:-127.0.0.1}

  telnet-collector:
    ports:
      - "127.0.0.1:${AMBER_TELNET_HOST_PORT:-2323}:23"
    environment:
      AMBER_TELNET_RELAX_DST: ${AMBER_TELNET_RELAX_DST:-1}

  smtp-collector:
    ports:
      # Override with AMBER_LAB_BIND=0.0.0.0 for remote/Spot labs (lock SG to operator IP).
      - "${AMBER_LAB_BIND:-127.0.0.1}:${AMBER_SMTP_HOST_PORT:-2525}:25"
    environment:
      AMBER_SMTP_RELAX_DST: ${AMBER_SMTP_RELAX_DST:-1}

  pop3-collector:
    ports:
      - "${AMBER_LAB_BIND:-127.0.0.1}:${AMBER_POP3_HOST_PORT:-1110}:110"
    environment:
      AMBER_POP3_RELAX_DST: ${AMBER_POP3_RELAX_DST:-1}

  # Wave A — default localhost. Honeypot SSH is NOT host admin SSH (G9).
  ssh-collector:
    ports:
      - "${AMBER_LAB_BIND:-127.0.0.1}:${AMBER_SSH_HOST_PORT:-2222}:22"
    environment:
      AMBER_SSH_RELAX_DST: ${AMBER_SSH_RELAX_DST:-1}

  redis-collector:
    ports:
      - "127.0.0.1:${AMBER_REDIS_HOST_PORT:-6379}:6379"
    environment:
      AMBER_REDIS_RELAX_DST: ${AMBER_REDIS_RELAX_DST:-1}

  mqtt-collector:
    ports:
      - "127.0.0.1:${AMBER_MQTT_HOST_PORT:-1883}:1883"
    environment:
      AMBER_MQTT_RELAX_DST: ${AMBER_MQTT_RELAX_DST:-1}

  http-collector:
    ports:
      - "127.0.0.1:${AMBER_HTTP_HOST_PORT:-8080}:80"
    environment:
      AMBER_HTTP_RELAX_DST: ${AMBER_HTTP_RELAX_DST:-1}

  mysql-collector:
    ports:
      - "127.0.0.1:${AMBER_MYSQL_HOST_PORT:-3306}:3306"
    environment:
      AMBER_MYSQL_RELAX_DST: ${AMBER_MYSQL_RELAX_DST:-1}

  postgres-collector:
    ports:
      - "127.0.0.1:${AMBER_POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      AMBER_POSTGRES_RELAX_DST: ${AMBER_POSTGRES_RELAX_DST:-1}

  smb-collector:
    ports:
      - "127.0.0.1:${AMBER_SMB_HOST_PORT:-445}:445"
    environment:
      AMBER_SMB_RELAX_DST: ${AMBER_SMB_RELAX_DST:-1}

  mongo-collector:
    ports:
      - "127.0.0.1:${AMBER_MONGO_HOST_PORT:-27017}:27017"
    environment:
      AMBER_MONGO_RELAX_DST: ${AMBER_MONGO_RELAX_DST:-1}

  elastic-collector:
    ports:
      - "127.0.0.1:${AMBER_ELASTIC_HOST_PORT:-9200}:9200"
    environment:
      AMBER_ELASTIC_RELAX_DST: ${AMBER_ELASTIC_RELAX_DST:-1}

  # Wave D — orchestration traps (G4/G8: mocks only, no host socket mount)
  dockerapi-collector:
    ports:
      - "127.0.0.1:${AMBER_DOCKERAPI_HOST_PORT:-2375}:2375"
    environment:
      AMBER_DOCKERAPI_RELAX_DST: ${AMBER_DOCKERAPI_RELAX_DST:-1}

  kubelet-collector:
    ports:
      - "127.0.0.1:${AMBER_KUBELET_HOST_PORT:-10250}:10250"
    environment:
      AMBER_KUBELET_RELAX_DST: ${AMBER_KUBELET_RELAX_DST:-1}

  # Wave E — Ollama mock (no large model pulls)
  ollama-collector:
    ports:
      - "127.0.0.1:${AMBER_OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      AMBER_OLLAMA_RELAX_DST: ${AMBER_OLLAMA_RELAX_DST:-1}

  # Wave F — DNS (udp + tcp 53; authoritative-only honeypot, G13)
  dns-collector:
    ports:
      - "127.0.0.1:${AMBER_DNS_HOST_PORT:-1053}:53/udp"
      - "127.0.0.1:${AMBER_DNS_HOST_PORT:-1053}:53/tcp"
    environment:
      AMBER_DNS_RELAX_DST: ${AMBER_DNS_RELAX_DST:-1}

  # Wave G — tftp (udp 69 + dnsmasq fixed transfer range; hpa/atftpd
  # negotiate random transfer ports and only work for same-path clients)
  tftp-collector:
    ports:
      - "127.0.0.1:${AMBER_TFTP_HOST_PORT:-1069}:69/udp"
      - "127.0.0.1:30050-30089:30050-30089/udp"
    environment:
      AMBER_TFTP_RELAX_DST: ${AMBER_TFTP_RELAX_DST:-1}

  # Wave G — snmp (udp+tcp 161)
  snmp-collector:
    ports:
      - "127.0.0.1:${AMBER_SNMP_HOST_PORT:-1161}:161/udp"
      - "127.0.0.1:${AMBER_SNMP_HOST_PORT:-1161}:161/tcp"
    environment:
      AMBER_SNMP_RELAX_DST: ${AMBER_SNMP_RELAX_DST:-1}

  # Wave G — ntp (udp 123)
  ntp-collector:
    ports:
      - "127.0.0.1:${AMBER_NTP_HOST_PORT:-1123}:123/udp"
    environment:
      AMBER_NTP_RELAX_DST: ${AMBER_NTP_RELAX_DST:-1}

  # Wave G — syslog (tcp+udp 514)
  syslog-collector:
    ports:
      - "127.0.0.1:${AMBER_SYSLOG_HOST_PORT:-1514}:514/tcp"
      - "127.0.0.1:${AMBER_SYSLOG_HOST_PORT:-1514}:514/udp"
    environment:
      AMBER_SYSLOG_RELAX_DST: ${AMBER_SYSLOG_RELAX_DST:-1}

  # Wave G — sip (tcp+udp 5060)
  sip-collector:
    ports:
      - "127.0.0.1:${AMBER_SIP_HOST_PORT:-15060}:5060/tcp"
      - "127.0.0.1:${AMBER_SIP_HOST_PORT:-15060}:5060/udp"
    environment:
      AMBER_SIP_RELAX_DST: ${AMBER_SIP_RELAX_DST:-1}

  # Wave G — ldap (tcp 389)
  ldap-collector:
    ports:
      - "127.0.0.1:${AMBER_LDAP_HOST_PORT:-1389}:389/tcp"
    environment:
      AMBER_LDAP_RELAX_DST: ${AMBER_LDAP_RELAX_DST:-1}

  # Wave H — imap (tcp 143)
  imap-collector:
    ports:
      - "127.0.0.1:${AMBER_IMAP_HOST_PORT:-1143}:143/tcp"
    environment:
      AMBER_IMAP_RELAX_DST: ${AMBER_IMAP_RELAX_DST:-1}

  # Wave H — memcached (tcp+udp 11211)
  memcached-collector:
    ports:
      - "127.0.0.1:${AMBER_MEMCACHED_HOST_PORT:-11211}:11211/tcp"
      - "127.0.0.1:${AMBER_MEMCACHED_HOST_PORT:-11211}:11211/udp"
    environment:
      AMBER_MEMCACHED_RELAX_DST: ${AMBER_MEMCACHED_RELAX_DST:-1}

  # Wave H — rdp (tcp 3389)
  rdp-collector:
    ports:
      - "127.0.0.1:${AMBER_RDP_HOST_PORT:-13389}:3389/tcp"
    environment:
      AMBER_RDP_RELAX_DST: ${AMBER_RDP_RELAX_DST:-1}

  # Wave H — vnc (tcp 5900)
  vnc-collector:
    ports:
      - "127.0.0.1:${AMBER_VNC_HOST_PORT:-15900}:5900/tcp"
    environment:
      AMBER_VNC_RELAX_DST: ${AMBER_VNC_RELAX_DST:-1}

  # Wave H — netbios (udp 137)
  netbios-collector:
    ports:
      - "127.0.0.1:${AMBER_NETBIOS_HOST_PORT:-1137}:137/udp"
    environment:
      AMBER_NETBIOS_RELAX_DST: ${AMBER_NETBIOS_RELAX_DST:-1}
