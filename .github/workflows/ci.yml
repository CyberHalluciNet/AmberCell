name: lab-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  stage3:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.22"
      - name: Install Python deps
        run: pip install jsonschema
      - name: docker compose config (lab)
        run: COMPOSE_PROFILES=lab,core docker compose -f compose.yaml -f compose.lab.yaml config >/dev/null
      - name: Compose wiring (all wave profiles, lab + production containment overlays)
        # Cheap check, no image builds: every wave profile must resolve in both
        # overlays after compose edits (catches env/port/profile drift).
        run: |
          for w in core wave-a wave-b wave-c wave-d wave-e wave-f wave-g wave-h; do
            docker compose -f compose.yaml -f compose.lab.yaml --profile lab --profile "$w" config -q
            docker compose -f compose.yaml -f compose.containment.yaml --profile production --profile "$w" config -q
          done
      - name: Stage-3 checks
        run: bash tests/test_stage3_ci.sh
      - name: Stage-4 lab checks
        run: bash tests/test_stage4_ci.sh
      - name: Stage-4 verify (lab SKIP G1–G11)
        run: bash tests/test_stage4_verify.sh
      - name: Rebuild contract
        run: bash tests/test_rebuild_contract.sh
      - name: Isolation stub
        run: bash tests/test_isolation_linux.sh
