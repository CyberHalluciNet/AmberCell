# AmberCell NetBIOS honeypot — nmbd name service only (no smbd file shares
# here; the smb cell owns 445).
[global]
  workgroup = AMBERCELL
  netbios name = FILESRV01
  netbios aliases = BACKUP01, PRINT01
  server role = standalone server
  disable netbios = no
  load printers = no
  printcap name = /dev/null
  logging = file:/dev/stderr
  log level = 2
