# AmberCell Cyrus master — POP3 on :110; IMAP localhost-only for seed/admin.
START {
  recover cmd="/usr/sbin/cyrus ctl_cyrusdb -r"
}

SERVICES {
  imap cmd="imapd -U 30" listen="127.0.0.1:143" prefork=0 maxchild=20
  pop3 cmd="pop3d -U 30" listen="110" prefork=0 maxchild=50
  lmtpunix cmd="lmtpd" listen="/run/cyrus/socket/lmtp" prefork=1 maxchild=20
}

EVENTS {
  checkpoint cmd="/usr/sbin/cyrus ctl_cyrusdb -c" period=30
}
