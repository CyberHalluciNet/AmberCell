# AmberCell DNS honeypot — Unbound (alternate provider)
#
# Authoritative lure zones via local-data; everything else REFUSED via the
# "." refuse zone — no recursion, never an open resolver (G13). identity/
# version strings are stable persona (anti-drift) recorded in evidence.
server:
	interface: 0.0.0.0
	port: 53
	do-ip4: yes
	do-ip6: no
	do-udp: yes
	do-tcp: yes
	username: ""
	chroot: ""
	directory: "/tmp"
	pidfile: "/tmp/unbound.pid"
	verbosity: 1
	use-syslog: no
	# Honeypot: answer every source (unbound's default would refuse
	# non-localhost queriers — the whole point here is to be queried).
	access-control: 0.0.0.0/0 allow
	identity: "ambercell-unbound"
	version: "Unbound 1.19"
	hide-identity: no
	hide-version: no
	qname-minimisation: no
	# Lure zone 1: ambercell.lab (mail/vpn/dev personas)
	local-zone: "ambercell.lab." static
	local-data: "ambercell.lab. 3600 IN MX 10 mail.ambercell.lab."
	local-data: "ns.ambercell.lab. 3600 IN A 10.20.30.53"
	local-data: "www.ambercell.lab. 3600 IN A 10.20.30.80"
	local-data: "mail.ambercell.lab. 3600 IN A 10.20.30.25"
	local-data: "vpn.ambercell.lab. 3600 IN A 10.20.30.44"
	local-data: "dev.ambercell.lab. 3600 IN A 10.20.30.22"
	local-data: "staging.ambercell.lab. 3600 IN A 10.20.30.23"
	local-data: "canary.ambercell.lab. 3600 IN TXT \"ambercell-dns-lure-01\""
	# Lure zone 2: corp.example.net (matches SMTP/POP3 lure mailboxes)
	local-zone: "corp.example.net." static
	local-data: "hr.corp.example.net. 3600 IN A 10.20.31.10"
	local-data: "finance.corp.example.net. 3600 IN A 10.20.31.11"
	local-data: "admin.corp.example.net. 3600 IN A 10.20.31.12"
	local-data: "support.corp.example.net. 3600 IN A 10.20.31.13"
	local-data: "mail.corp.example.net. 3600 IN A 10.20.31.25"
	# Everything else → REFUSED (recursion probes get an answer, no recursion)
	local-zone: "." refuse

remote-control:
	control-enable: no
