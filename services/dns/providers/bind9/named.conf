// AmberCell DNS honeypot — BIND9 (alternate provider)
//
// Authoritative-only: recursion no, no forwarders, allow-recursion none — the
// cell can never become an open resolver or amplification vector (G13).
// version string is a stable persona (anti-drift) recorded in evidence.
options {
	// read_only rootfs (compose baseline): the working directory must be a
	// tmpfs; zones are referenced by absolute path from the read-only image.
	directory "/tmp";
	pid-file "/tmp/named.pid";
	session-keyfile "/tmp/session.key";
	managed-keys-directory "/tmp";
	listen-on port 53 { any; };
	listen-on-v6 { none; };
	recursion no;
	allow-query { any; };
	allow-recursion { none; };
	allow-transfer { none; };   // AXFR is denied; attempts are captured by the collector
	version "BIND 9.18.30";
	minimal-responses no;
};

// No rndc control channel (nothing to write, nothing to expose).
controls { };

zone "ambercell.lab" IN {
	type master;
	file "/etc/bind/zones/db.ambercell.lab";
};

zone "corp.example.net" IN {
	type master;
	file "/etc/bind/zones/db.corp.example.net";
};
