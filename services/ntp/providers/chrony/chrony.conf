# AmberCell NTP honeypot — chronyd serving from the unsynced local clock.
# No upstream servers: the cell must not egress (G1/G14); clients still get
# replies (stratum from `local`).
port 123
bindcmdaddress 127.0.0.1
allow 0.0.0.0/0
local stratum 2 orphan
driftfile /tmp/chrony.drift
pidfile /tmp/chrony.pid
dumpdir /tmp
