# AmberCell IMAP honeypot — dovecot, IMAP only, weak lure creds (passwd-file).
# Mail store + indexes live on the /tmp tmpfs (read-only rootfs baseline).
listen = *
# Honeypot: accept plaintext LOGIN (weak-cred capture) without STARTTLS.
disable_plaintext_auth = no
# read-only rootfs: keep runtime state on the /tmp tmpfs
base_dir = /tmp/dovecot
state_dir = /tmp/dovecot
protocols = imap
log_path = /dev/stderr
mail_location = mbox:/tmp/mail:INBOX=/tmp/mail/%u/inbox
first_valid_uid = 500

passdb {
  driver = passwd-file
  args = scheme=plain username_format=%u /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}
