# AmberCell Exim sinkhole — corp.example.net only; no outbound relay.
primary_hostname = mail.corp.example.net
qualify_domain = corp.example.net
domainlist local_domains = corp.example.net : localhost : localhost.localdomain
domainlist relay_to_domains =
hostlist   relay_from_hosts = <; 127.0.0.0/8 ; 172.30.0.0/16

acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data

local_interfaces = 0.0.0.0
daemon_smtp_ports = 25
never_users = root
host_lookup =
rfc1413_hosts =
rfc1413_query_timeout = 0s
ignore_bounce_errors_after = 0s
timeout_frozen_after = 1d
message_size_limit = 10M
tls_advertise_hosts =
smtp_banner = $smtp_active_hostname ESMTP Exim (AmberCell sinkhole)

begin acl

acl_check_rcpt:
  accept  hosts = :
  deny    message   = Restricted characters in address
          domains   = +local_domains
          local_parts = ^[.] : ^.*[@%!/|]
  deny    message   = Restricted characters in address
          domains   = !+local_domains
          local_parts = ^[./|] : ^.*[@%!/|] : ^.*/\\.\\./
  accept  local_parts = hr : finance : admin : support
          domains     = +local_domains
          endpass
          verify        = recipient
  deny    message   = relay not permitted
          domains   = !+local_domains
  deny    message   = unknown user

acl_check_data:
  accept

begin routers

localuser:
  driver = accept
  domains = +local_domains
  local_parts = hr : finance : admin : support
  transport = local_delivery
  no_more

begin transports

local_delivery:
  driver = appendfile
  file = /var/mail/$local_part
  delivery_date_add
  envelope_to_add
  return_path_add
  group = mail
  mode = 0660

begin retry
*                      *           F,2h,15m; G,16h,1h,1.5; F,4d,6h

begin rewrite

begin authenticators
