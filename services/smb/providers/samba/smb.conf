[global]
   workgroup = WORKGROUP
   server string = AmberCell File Server
   security = user
   map to guest = Bad User
   load printers = no
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 50
   passdb backend = tdbsam

[public]
   path = /shares/public
   browseable = yes
   read only = no
   guest ok = yes
   force user = nobody

[admin]
   path = /shares/admin
   browseable = yes
   read only = no
   guest ok = no
   valid users = admin
