#!KAMAILIO
# AmberCell SIP honeypot — real kamailio, stateless replies on udp+tcp 5060.
# @@MPATH@@ is substituted by the entrypoint (arch-dependent module dir).
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
# TCP is enabled implicitly by the listen=tcp: line below (enable_tcp is
# not a valid core variable on this build).
auto_aliases=no
children=2
tcp_children=2
fork=yes
log_stderror=yes
debug=1
mpath="@@MPATH@@"
loadmodule "sl.so"

request_route {
    sl_send_reply("200", "AmberCell SIP OK");
}
