# AmberCell LDAP honeypot — slapd static config; weak rootpw is intentional bait.
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
modulepath /usr/lib/ldap
moduleload back_mdb
pidfile /tmp/slapd.pid
argsfile /tmp/slapd.args

database mdb
suffix "dc=ambercell,dc=lab"
rootdn "cn=admin,dc=ambercell,dc=lab"
rootpw admin123
directory /tmp/db
index objectClass eq
access to * by * read
