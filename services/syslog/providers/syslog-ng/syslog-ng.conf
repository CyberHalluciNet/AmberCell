@version: 3.38
# AmberCell syslog honeypot — receive tcp+udp 514, echo raw to stdout.
source s_net_tcp { network(transport("tcp") port(514)); };
source s_net_udp { network(transport("udp") port(514)); };
destination d_out { file("/dev/stdout" template("$MSGHDR$MESSAGE\n")); };
log { source(s_net_tcp); destination(d_out); };
log { source(s_net_udp); destination(d_out); };
