# AmberCell syslog honeypot — receive on tcp+udp 514, echo to stdout (collector FIFO).
module(load="imtcp")
module(load="imudp")
input(type="imtcp" port="514")
input(type="imudp" port="514")
template(name="amberline" type="string" string="%rawmsg%\n")
*.* action(type="omfile" file="/dev/stdout" template="amberline")
