  dns-collector:
    profiles: ["wave-f"]
    build:
      context: .
      dockerfile: collectors/dns/Dockerfile
    image: ambercell-dns-collector:local
    container_name: ambercell-dns-collector
    init: true
    oom_score_adj: -500
    mem_limit: 512m
    memswap_limit: 512m
