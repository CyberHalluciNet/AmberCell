# AmberCell Compose — Stage-0B FTP proof cell (production-shaped base)
#
# Profiles:
#   core         — FTP, Telnet, SMTP, POP3 cells
#   lab          — marker; use with compose.lab.yaml for localhost published ports
#   production   — marker; use nftables DNAT only (nftables/*.nft), no Compose ports
#   wave-a..e    — expansion waves (later stages)
#
# Lab (laptop/CI):
#   COMPOSE_PROFILES=lab,core docker compose -f compose.yaml -f compose.lab.yaml up -d --build
#   COMPOSE_PROFILES=lab,core,wave-a …  # Stage-5 SSH/Redis/MQTT (see compose.lab.yaml ports)
#   COMPOSE_PROFILES=lab,wave-b,wave-c …  # Stage-6 HTTP/SQL + SMB/NoSQL
#   COMPOSE_PROFILES=lab,wave-d,wave-e …  # Stage-7 traps + Ollama mock
#
# Production (Linux host + nftables):
#   COMPOSE_PROFILES=production,core docker compose -f compose.yaml up -d --build
#   # then apply nftables/ingress.nft + nftables/egress.nft
#
# amberctl up/down defaults to the lab file pair when COMPOSE_PROFILES includes lab.

name: ambercell

networks:
  ambernet:
    name: ambernet
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.30.0.0/16

  ambermgmt:
    name: ambermgmt
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.10.0/24

volumes:
  # Shared upload landing (hi writes; collector hashes via UDS queue — not host inotify).
  ftp-incoming:
    name: ambercell-ftp-incoming
  # FIFO log handoff (collector opens read end; *-hi tees daemon logs).
  mail-log-fifo:
    name: ambercell-mail-log-fifo
  wave-log-fifo:
    name: ambercell-wave-log-fifo
  ssh-uploads:
    name: ambercell-ssh-uploads
  redis-data:
    name: ambercell-redis-data
  http-uploads:
    name: ambercell-http-uploads
  mysql-data:
    name: ambercell-mysql-data
  postgres-data:
    name: ambercell-postgres-data
  smb-shares:
    name: ambercell-smb-shares
  mongo-data:
    name: ambercell-mongo-data
  elastic-data:
    name: ambercell-elastic-data

services:
  ftp-collector:
    profiles: ["core"]
    build:
      context: .
      dockerfile: collectors/ftp/Dockerfile
    image: ambercell-ftp-collector:local
    container_name: ambercell-ftp-collector
    init: true
    # Prefer collector under OOM (edge 2.2). May be ignored under userns/cap_drop.
    oom_score_adj: -500
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    cap_drop:
      - ALL
    cap_add:
      # NET_RAW required for tcpdump; NET_ADMIN kept for -i any / cooked capture on some kernels.
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      # Evidence ONLY on collector (never mount into *-hi). No deaddrop bind.
      - ${AMBER_EVIDENCE_ROOT:-./.ambercell-data}:/var/ambercell
      # Shared with ftp-hi for real sha256 on STOR (collector-side watch → UDS queue).
      - ftp-incoming:/mnt/hi-uploads
    environment:
      AMBER_EVIDENCE_ROOT: /var/ambercell
      AMBER_FTP_PROVIDER: ${AMBER_FTP_PROVIDER:-vsftpd}
      AMBER_FTP_CELL_IP: "172.30.30.10"
      AMBER_FTP_CELL_ID: ftp-cell-01
      AMBER_FTP_COLLECTOR_ID: ftp-collector-a
      AMBER_FTP_UPLOAD_DIR: /mnt/hi-uploads
      AMBER_ARTIFACT_SOCK: /var/ambercell/run/artifact-ftp.sock
      AMBER_IMAGE_DIGEST: ${AMBER_IMAGE_DIGEST:-}
      AMBER_FTP_HI_DIGEST: ${AMBER_FTP_HI_DIGEST:-}
      AMBER_CELL_INSTANCE_ID: ${AMBER_CELL_INSTANCE_ID:-ftp-lab-01}
      AMBER_DEBUG_SCHEMA_VALIDATE: ${AMBER_DEBUG_SCHEMA_VALIDATE:-1}
      # Production default: strict cell-IP matching. Lab overlay sets RELAX_DST=1.
      AMBER_FTP_RELAX_DST: ${AMBER_FTP_RELAX_DST:-0}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks:
      ambernet:
        ipv4_address: 172.30.30.10
    # No Compose ports here — production uses nftables DNAT.
    # Lab ports: compose.lab.yaml (127.0.0.1 only).
    labels:
      ambercell.svc: ftp
      ambercell.role: collector
      ambercell.rev: "ff4f50"

  ftp-hi:
    profiles: ["core"]
    build:
      context: ${AMBER_FTP_PROVIDER_CONTEXT:-services/ftp/providers/vsftpd}
      dockerfile: Dockerfile
    image: ${AMBER_FTP_HI_IMAGE:-ambercell-ftp-hi-vsftpd:local}
    container_name: ambercell-ftp-hi
    # Shares collector netns — no separate IP, no host evidence mount, no ports.
    network_mode: "service:ftp-collector"
    depends_on:
      ftp-collector:
        condition: service_started
    init: true
    oom_score_adj: 500
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    stop_grace_period: 15s
    cap_drop:
      - ALL
    # vsftpd needs bind + privilege drop + chroot; keep the set minimal for the daemon.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - SYS_CHROOT
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
      # Production: also apply compose.containment.yaml (seccomp + AppArmor).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/vsftpd:rw,noexec,nosuid,size=8m
    volumes:
      # Shared upload path with ftp-collector (real sha256; not host evidence mount).
      - ftp-incoming:/var/ftp/incoming
    environment:
      AMBER_FTP_PROVIDER: ${AMBER_FTP_PROVIDER:-vsftpd}
      # No lab default here — production must set public IPv4.
      # Lab overlay (compose.lab.yaml) sets 127.0.0.1 when unset.
      AMBER_FTP_PASV_ADDRESS: ${AMBER_FTP_PASV_ADDRESS:-}
      # Propagate profile markers so vsftpd entrypoint can refuse lab PASV in production.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      AMBER_PROFILE: ${AMBER_PROFILE:-}
    labels:
      ambercell.svc: ftp
      ambercell.role: hi

  telnet-collector:
    profiles: ["core"]
    build:
      context: .
      dockerfile: collectors/telnet/Dockerfile
    image: ambercell-telnet-collector:local
    container_name: ambercell-telnet-collector
    init: true
    oom_score_adj: -500
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${AMBER_EVIDENCE_ROOT:-./.ambercell-data}:/var/ambercell
    environment:
      AMBER_EVIDENCE_ROOT: /var/ambercell
      AMBER_TELNET_PROVIDER: ${AMBER_TELNET_PROVIDER:-busybox-telnetd}
      AMBER_TELNET_CELL_IP: "172.30.40.10"
      AMBER_TELNET_CELL_ID: telnet-cell-01
      AMBER_TELNET_COLLECTOR_ID: telnet-collector-a
      AMBER_IMAGE_DIGEST: ${AMBER_IMAGE_DIGEST:-}
      AMBER_TELNET_HI_DIGEST: ${AMBER_TELNET_HI_DIGEST:-}
      AMBER_CELL_INSTANCE_ID: ${AMBER_CELL_INSTANCE_ID:-telnet-lab-01}
      AMBER_DEBUG_SCHEMA_VALIDATE: ${AMBER_DEBUG_SCHEMA_VALIDATE:-1}
      AMBER_TELNET_RELAX_DST: ${AMBER_TELNET_RELAX_DST:-0}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks:
      ambernet:
        ipv4_address: 172.30.40.10
    labels:
      ambercell.svc: telnet
      ambercell.role: collector
      ambercell.rev: "ff4f50"

  smtp-collector:
    profiles: ["core"]
    build:
      context: .
      dockerfile: collectors/smtp/Dockerfile
    image: ambercell-smtp-collector:local
    container_name: ambercell-smtp-collector
    init: true
    oom_score_adj: -500
    mem_limit: 768m
