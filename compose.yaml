      ambercell.svc: dns
      ambercell.role: collector

  dns-hi:
    profiles: ["wave-f"]
    build:
      context: ${AMBER_DNS_PROVIDER_CONTEXT:-services/dns/providers/coredns}
      dockerfile: Dockerfile
    image: ${AMBER_DNS_HI_IMAGE:-ambercell-dns-hi-coredns:local}
    container_name: ambercell-dns-hi
    network_mode: "service:dns-collector"
