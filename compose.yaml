      AMBER_POP3_COLLECTOR_ID: pop3-collector-a
      AMBER_POP3_LOG_FIFO: /run/amber/log/pop3.fifo
      AMBER_IMAGE_DIGEST: ${AMBER_IMAGE_DIGEST:-}
      AMBER_POP3_HI_DIGEST: ${AMBER_POP3_HI_DIGEST:-}
      AMBER_CELL_INSTANCE_ID: ${AMBER_CELL_INSTANCE_ID:-pop3-lab-01}
      AMBER_DEBUG_SCHEMA_VALIDATE: ${AMBER_DEBUG_SCHEMA_VALIDATE:-1}
      AMBER_POP3_RELAX_DST: ${AMBER_POP3_RELAX_DST:-0}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks:
      ambernet:
        ipv4_address: 172.30.20.10
    labels:
