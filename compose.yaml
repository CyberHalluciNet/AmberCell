      AMBER_SMTP_PROVIDER: ${AMBER_SMTP_PROVIDER:-postfix}
      AMBER_SMTP_CELL_IP: "172.30.10.10"
      AMBER_SMTP_CELL_ID: smtp-cell-01
      AMBER_SMTP_COLLECTOR_ID: smtp-collector-a
      AMBER_SMTP_LOG_FIFO: /run/amber/log/smtp.fifo
      AMBER_IMAGE_DIGEST: ${AMBER_IMAGE_DIGEST:-}
      AMBER_SMTP_HI_DIGEST: ${AMBER_SMTP_HI_DIGEST:-}
      AMBER_CELL_INSTANCE_ID: ${AMBER_CELL_INSTANCE_ID:-smtp-lab-01}
      AMBER_DEBUG_SCHEMA_VALIDATE: ${AMBER_DEBUG_SCHEMA_VALIDATE:-1}
      AMBER_SMTP_RELAX_DST: ${AMBER_SMTP_RELAX_DST:-0}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    networks:
      ambernet:
        ipv4_address: 172.30.10.10
    labels:
      ambercell.svc: smtp
      ambercell.role: collector
      ambercell.rev: "ff4f50"

  smtp-hi:
    profiles: ["core"]
    build:
      context: ${AMBER_SMTP_PROVIDER_CONTEXT:-services/smtp/providers/postfix}
      dockerfile: Dockerfile
    image: ${AMBER_SMTP_HI_IMAGE:-ambercell-smtp-hi-postfix:local}
    container_name: ambercell-smtp-hi
    network_mode: "service:smtp-collector"
    depends_on:
      smtp-collector:
        condition: service_started
    init: true
    oom_score_adj: 500
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    stop_grace_period: 15s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    # Postfix needs writable spool + config helpers; keep tmpfs-backed runtime paths.
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/spool/postfix:rw,nosuid,size=128m
      - /var/lib/postfix:rw,nosuid,size=32m
      - /var/mail:rw,nosuid,size=32m
    volumes:
      - mail-log-fifo:/run/amber/log
    environment:
      AMBER_SMTP_PROVIDER: ${AMBER_SMTP_PROVIDER:-postfix}
      AMBER_SMTP_LOG_FIFO: /run/amber/log/smtp.fifo
    labels:
      ambercell.svc: smtp
      ambercell.role: hi

