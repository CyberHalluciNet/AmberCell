    labels:
      ambercell.svc: dns
      ambercell.role: hi

  # Control plane — ambermgmt only (cells have no route here; host DNAT sends udp/53).
  dns-sinkhole:
    profiles: ["core"]
    build:
      context: ops/dns-sinkhole
      dockerfile: Dockerfile
    image: ambercell-dns-sinkhole:local
    container_name: ambercell-dns-sinkhole
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      # dnsmasq drops to the dnsmasq user/group at startup
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      ambermgmt:
        ipv4_address: 172.31.10.53
    labels:
      ambercell.svc: dns-sinkhole
      ambercell.role: control
